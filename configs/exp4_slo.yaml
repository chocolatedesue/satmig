name: exp4_slo
description: >
  E4 -- the latency budget sweep.  Reports, for each TPOT SLO, the largest
  split each placement admits.  The crossing point where the SLO ceiling rises
  above the memory floor (P = 10) is the feasibility frontier of the whole
  design.

constellation:
  n_planes: 72
  n_sats_per_plane: 22
  epoch_days_since_j2000: 9210.0

workload:
  n_pipelines: 1
  stages: 10
  placement: along_track
  snake_width: 5
  stacking_k: 4

sim:
  horizon_s: 5730.0
  slot_s: 10.0
  c_eclipse: 0.2
  policies: [conveyor, eph, eph_compact, eph_freeness]

sweep:
  workload.slo_tpot_ms: [50.0, 60.0, 70.0, 80.0, 100.0, 120.0, 160.0, 220.0]
