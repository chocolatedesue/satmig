name: exp5_season
description: >
  E5 -- seasonality of the free lunch.  The number of eclipse-free planes in a
  53 deg shell depends on solar declination, so the two-timescale policy's
  zero-migration regime exists near the solstices and vanishes near the
  equinoxes.  A migration planner sized at one epoch is wrong by 100% at the
  other.

constellation:
  n_planes: 72
  n_sats_per_plane: 22

workload:
  n_pipelines: 2
  stages: 6
  placement: along_track
  snake_width: 3
  slo_tpot_ms: 100.0

sim:
  horizon_s: 11460.0
  slot_s: 10.0
  c_eclipse: 0.2
  policies: [static, conveyor, eph, eph_compact, eph_freeness, two_timescale]

sweep:
  constellation.epoch_days_since_j2000: [9210.0, 9235.0, 9260.0, 9285.0, 9303.0, 9330.0, 9360.0, 9395.0]
