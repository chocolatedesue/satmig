name: exp2_multipipeline
description: >
  E2 -- K pipelines contending for the lit arc of a small "hot region" of
  planes.  Tests the LAB-47 conjecture that multi-pipeline contention shows up
  as an ISL migration storm.  It does not: at 100 Gbps the ISL never saturates.
  What binds is lit-arc occupancy, and the policies differ in whether they can
  spill across planes.

constellation:
  altitude_km: 550.0
  inclination_deg: 53.0
  n_planes: 72
  n_sats_per_plane: 22
  epoch_days_since_j2000: 9210.0

workload:
  stages: 6
  placement: along_track
  snake_width: 3
  slo_tpot_ms: 100.0
  stacking_k: 4
  plane_window: 2

sim:
  horizon_s: 11460.0
  slot_s: 10.0
  c_eclipse: 0.2
  policies: [static, reactive_jit, llumnix_reactive, conveyor, eph, eph_compact, eph_freeness, two_timescale]

sweep:
  workload.n_pipelines: [1, 2, 3, 4, 6, 8]
